server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clinicaltrial?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Preserve operational data between restarts; override with DDL_AUTO when needed.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: clinical-trial-app
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE

kafka:
  enabled: false

ai:
  service:
    url: http://localhost:8091

cors:
  allowed-origins: http://localhost:5174

logging:
  level:
    com.clinicaltrial: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
